<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d0efea">
<title>Coconut</title>
<meta name="description" content="Coconut: your agents and your team on your iPhone, running on your own Mac.">
<meta property="og:title" content="Coconut">
<meta property="og:description" content="Your agents and your team, on your own Mac.">
<meta property="og:image" content="https://workcoconut.com/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/coconut.png">
<link rel="apple-touch-icon" href="/coconut.png">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: radial-gradient(110% 90% at 32% 42%, #e6f7f4, #d0efea 58%, #bfe4dd);
    color: #271910; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* A computer: the recording plays in an iPhone, next to the code that a phone scans. */
  main { min-height: 100%; display: flex; align-items: center; justify-content: center;
         gap: clamp(56px, 9vw, 150px); padding: 5vh 48px; }
  .phone {
    /* The height of the phone sets every other measure, so it keeps the shape of an iPhone 17 Pro at any size. */
    --h: min(88vh, 900px);
    --b: calc(var(--h) * .0135);
    --sw: calc((var(--h) - 2 * var(--b)) * 1206 / 2622);
    position: relative; flex: none; height: var(--h); width: calc(var(--sw) + 2 * var(--b)); padding: var(--b);
    border-radius: calc(var(--sw) * .155 + var(--b));
    background: linear-gradient(150deg, #48484c, #1d1d1f 22%, #0d0d0e 70%, #3a3a3d);
    box-shadow: inset 0 0 0 1.5px #66666b, inset 0 0 0 3px #111, 0 60px 110px -30px rgba(18, 70, 62, .5),
                0 30px 50px -30px rgba(0, 0, 0, .45);
  }
  /* The buttons on the sides: the action button and the volume on the left, the side button on the right. */
  .phone::before, .phone::after { content: ""; position: absolute; width: 3px; border-radius: 2px; background: #2c2c2e; }
  .phone::before { left: -3px; top: 17%; height: 3.6%;
                   box-shadow: 0 calc(var(--h) * .072) #2c2c2e, 0 calc(var(--h) * .144) #2c2c2e; }
  .phone::after { right: -3px; top: 25%; height: 11%; }
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: #fff;
            border-radius: calc(var(--sw) * .155); }
  video { display: block; width: 100%; height: 100%; object-fit: cover; background: #fff; }

  .get { width: 300px; }
  .icon { display: block; width: 76px; height: 76px; border-radius: 17px;
          box-shadow: 0 8px 22px rgba(39, 25, 16, .14), 0 0 0 1px rgba(39, 25, 16, .06); }
  h1 { margin-top: 22px; font-size: 64px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  .line { margin-top: 12px; font-size: 20px; line-height: 1.35; color: rgba(39, 25, 16, .7); text-wrap: balance; }
  .short { display: none; }
  .qr { display: block; width: 196px; margin-top: 40px; padding: 18px; border-radius: 26px; background: #fff;
        box-shadow: 0 14px 36px rgba(18, 70, 62, .16); }
  .qr img { display: block; width: 100%; height: auto; }
  .scan { margin-top: 14px; font-size: 15px; color: rgba(39, 25, 16, .62); }
  .button { display: none; padding: 10px 22px; border-radius: 999px; background: #845d40; color: #fff;
            font-size: 17px; font-weight: 600; text-decoration: none; }
  .more { margin-top: 34px; font-size: 14px; color: rgba(39, 25, 16, .55); }
  .more a { text-decoration: none; }
  .more a + a { margin-left: 16px; }

  /* A short window, as on a laptop: the same column, tighter, so it fits beside the phone. */
  @media (max-height: 760px) {
    .icon { width: 64px; height: 64px; border-radius: 14px; }
    h1 { margin-top: 16px; font-size: 52px; }
    .qr { width: 164px; margin-top: 26px; padding: 14px; border-radius: 22px; }
    .more { margin-top: 22px; }
  }

  /* A tablet, or a phone on its side: the same page with a button in place of the code. */
  @media (hover: none) {
    .qr, .scan { display: none; }
    .button { display: inline-block; margin-top: 32px; }
  }

  /* A phone: the recording is the page, edge to edge, with a small bar to get the app. */
  @media (max-width: 600px) and (orientation: portrait) {
    html, body { overflow: hidden; overscroll-behavior: none; background: #fff; }
    main { display: block; min-height: 0; padding: 0; }
    .phone { position: fixed; inset: 0; width: auto; height: auto; padding: 0; border-radius: 0; background: none;
             box-shadow: none; }
    .phone::before, .phone::after, .long { display: none; }
    .short { display: inline; }
    .screen { border-radius: 0; }
    video { object-position: 50% 0; }
    .get { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: auto;
           display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 12px; padding: 10px;
           border-radius: 24px; background: rgba(255, 255, 255, .74);
           -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
           box-shadow: 0 10px 34px rgba(0, 0, 0, .18), inset 0 0 0 .5px rgba(0, 0, 0, .1); }
    .icon { grid-row: 1 / 3; width: 48px; height: 48px; border-radius: 11px; box-shadow: 0 0 0 1px rgba(39, 25, 16, .06); }
    h1 { grid-column: 2; margin: 0; font-size: 17px; letter-spacing: -0.01em; }
    .line { grid-column: 2; margin: 1px 0 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qr, .scan, .more { display: none; }
    .button { display: inline-block; grid-column: 3; grid-row: 1 / 3; margin: 0; padding: 9px 22px; font-size: 16px; }
  }
</style>
</head>
<body>
<main>
  <div class="phone">
    <div class="screen">
      <video id="app" muted loop playsinline disablepictureinpicture disableremoteplayback preload="auto"
             poster="/app.jpg" aria-label="A recording of the Coconut iPhone app in use"></video>
    </div>
  </div>
  <div class="get">
    <img class="icon" src="/coconut.png" alt="">
    <h1>Coconut</h1>
    <p class="line"><span class="long">Your agents and your team, on your own Mac.</span><span class="short">Your agents, on your own Mac.</span></p>
    <a class="qr" href="/iphone"><img src="/qr.svg" width="29" height="29" alt="QR code for the iPhone app"></a>
    <p class="scan">Scan to get the iPhone app.</p>
    <a class="button" href="/iphone">Get</a>
    <p class="more"><a href="https://github.com/antiwork/coconut">GitHub</a><a href="/privacy">Privacy</a></p>
  </div>
</main>

<script>
  // A phone gets the recording without the status bar, because the phone shows its own. A computer gets the whole
  // screen in the iPhone frame. Reduce Motion keeps the first frame until a tap.
  const video = document.getElementById('app');
  const bleed = matchMedia('(max-width: 600px) and (orientation: portrait)');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  function choose() {
    const name = bleed.matches ? 'app-bleed' : 'app';
    if (video.getAttribute('src') === `/${name}.mp4`) return;
    video.poster = `/${name}.jpg`;
    video.src = `/${name}.mp4`;
    if (!still.matches) video.play().catch(() => {});
  }
  choose();
  bleed.addEventListener('change', choose);
  video.addEventListener('click', () => { if (video.paused) video.play(); else video.pause(); });
</script>
</body>
</html>
