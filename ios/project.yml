name: Coconut
packages:
  # A copy of MarkdownUI 2.4.1 with a patch: a row that a Mac list measures off screen gets the same block gaps as on
  # screen. See Packages/MarkdownUI/PATCHES.md.
  MarkdownUI:
    path: Packages/MarkdownUI
  # The updater of Coconut.app. The owner made the EdDSA key pair of the feed with this version. Update both together.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # CoconutKit: setup, status, updates and pairing of the service on this Mac (mac/Package.swift).
  CoconutMacKit:
    path: ../mac
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Coconut:
    type: application
    platform: iOS
    dependencies:
      - package: MarkdownUI
      - target: CoconutNotificationService
        embed: true
      - target: CoconutShare
        embed: true
    sources:
      - Coconut
      - PushShared
      - ShareShared
      - Tunnel
      - ../scripts/push-envelope.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumroad.coconut
        PRODUCT_NAME: Coconut
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Coconut
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Coconut connects to your Mac to receive agent messages and answer decisions.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: CoconutAppIcon
        CODE_SIGN_ENTITLEMENTS: Coconut/Coconut.entitlements
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
    info:
      path: Coconut/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: Google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.3509104299-du1m1pcfgm7meeivk712bmltf4bus8ae
          - CFBundleURLName: Pairing
            CFBundleURLSchemes:
              - coconut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CoconutPushEnvironment: $(APS_ENVIRONMENT)
        CoconutPushKeychainGroup: $(AppIdentifierPrefix)com.gumroad.coconut.push
        CoconutPushRelayURL: "https://coconut-push.gumroad.workers.dev"
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Coconut uses the camera when you scan a pairing QR code or take a photo to attach to a message.
        NSPhotoLibraryAddUsageDescription: Coconut saves a photo from a chat to your library only when you choose Save Image.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "100.64.0.0/10":
              NSExceptionAllowsInsecureHTTPLoads: true
        UIApplicationSupportsIndirectInputEvents: true
        NSBonjourServices:
          - _coconut._tcp
        # Each message of the person tells iOS about its project, team chat or person, so they show in the row of
        # people of the share sheet (ShareShared/ShareSuggestions.swift). iOS refuses such a donation from an app that
        # does not declare the intent here.
        NSUserActivityTypes:
          - INSendMessageIntent
  # The main executable of Coconut.app: the service controls in the menu bar and, later, the chat client. It compiles the
  # views and state of the iPhone app; the iPhone-only views stay out. scripts/mac_app.py builds it and makes the bundle.
  CoconutMac:
    type: application
    platform: macOS
    dependencies:
      - package: MarkdownUI
      - package: Sparkle
      - package: CoconutMacKit
        product: CoconutKit
      # scripts/mac_app.py copies the extension into Coconut.app and signs it with its sandbox.
      - target: CoconutMacShare
        embed: true
    sources:
      - path: Coconut
        excludes:
          - CoconutApp.swift
          - Assets.xcassets
          - Info.plist
          - Coconut.entitlements
      - PushShared
      - ShareShared
      - Tunnel
      - ../scripts/push-envelope.swift
      - ../mac/Sources/CoconutApp
      - ../mac/Sources/CoconutMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumroad.coconut.mac
        PRODUCT_NAME: Coconut
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
  CoconutNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - CoconutNotificationService
      - PushShared
      - ../scripts/push-envelope.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumroad.coconut.notification-service
        PRODUCT_NAME: CoconutNotificationService
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CoconutNotificationService/CoconutNotificationService.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: CoconutNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Coconut Notifications
        CFBundleURLTypes:
          - CFBundleURLName: Google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.3509104299-du1m1pcfgm7meeivk712bmltf4bus8ae
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CoconutPushKeychainGroup: $(AppIdentifierPrefix)com.gumroad.coconut.push
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # "Coconut" in the share sheet of the iPhone. It sends a share to the paired Mac itself, with the pairing of the app
  # (ShareShared/ShareSender.swift), so it compiles the tunnel and none of the views of the app.
  CoconutShare:
    type: app-extension
    platform: iOS
    sources:
      - CoconutShare
      - ShareShared
      - Tunnel/Noise.swift
      - Tunnel/TunnelFrames.swift
      - Coconut/TunnelConnection.swift
      - Coconut/FileFit.swift
      - Coconut/PlatformColor.swift
      - Coconut/Theme.swift
      - PushShared/TestIsolation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumroad.coconut.share
        PRODUCT_NAME: CoconutShare
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CoconutShare/CoconutShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: CoconutShare/Info.plist
      properties:
        CFBundleDisplayName: Coconut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CoconutPushKeychainGroup: $(AppIdentifierPrefix)com.gumroad.coconut.push
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            # A place of Coconut in the row of people of the share sheet opens the extension with that place chosen
            # (ShareShared/ShareSuggestions.swift).
            IntentsSupported:
              - INSendMessageIntent
            # Text, links, images, PDFs and other files. A message takes at most four files (ShareComposer.fileLimit).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 4
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
  # "Coconut" in the share menu of the Mac. It hands a share to Coconut.app, which sends it (ShareShared/ShareHandoff.swift).
  CoconutMacShare:
    type: app-extension
    platform: macOS
    sources:
      - CoconutMacShare
      - path: ShareShared
        excludes:
          - ShareSender.swift
      - Coconut/FileFit.swift
      - Coconut/PlatformColor.swift
      - Coconut/Theme.swift
      - PushShared/TestIsolation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gumroad.coconut.mac.share
        PRODUCT_NAME: CoconutMacShare
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CoconutMacShare/CoconutMacShare.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: CoconutMacShare/Info.plist
      properties:
        CFBundleDisplayName: Coconut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            # Text, links, images, PDFs and other files. A message takes at most four files (ShareComposer.fileLimit).
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 4
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsFileWithMaxCount: 4
schemes:
  Coconut:
    build:
      targets:
        Coconut: all
    run:
      config: Debug
  CoconutMac:
    build:
      targets:
        CoconutMac: all
