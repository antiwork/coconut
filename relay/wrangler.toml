name = "coconut-push"
account_id = "7c48de80b2886bfac114048cdb29febb"
main = "src/worker.js"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_BUNDLE_ID = "com.gumroad.coconut"
APPLE_TEAM_ID = "66LJACJ2U7"
ALLOW_DEVELOPMENT_ATTESTATION = "true"
# The Personal budget (src/budget.js). It stays off until the secret ANTHROPIC_API_KEY is set.
BUDGET_LIMIT_USD = "200"
BUDGET_MODEL = "claude-opus-5-5"
# Anthropic's list prices of BUDGET_MODEL in dollars per million tokens. web_search is millionths of a dollar per search ($10 per 1,000).
BUDGET_PRICES = '{"input":4,"output":20,"cache_read":0.2,"cache_write_5m":5,"cache_write_1h":8,"web_search":10000}'

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "PushDevice"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushDevice"]

[[durable_objects.bindings]]
name = "TUNNELS"
class_name = "Tunnel"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Tunnel"]

[[durable_objects.bindings]]
name = "RENDEZVOUS"
class_name = "Rendezvous"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Rendezvous"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Room"]

[[durable_objects.bindings]]
name = "BUDGETS"
class_name = "BudgetAccount"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["BudgetAccount"]

[[ratelimits]]
name = "REGISTRATION_LIMIT"
namespace_id = "1"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "DELIVERY_LIMIT"
namespace_id = "2"
simple = { limit = 120, period = 60 }

# The binding allows at most 60 seconds per window. The Tunnel Durable Object also allows 10 per hour for each IP.
[[ratelimits]]
name = "TUNNEL_REGISTER"
namespace_id = "3"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "TUNNEL_CONNECT"
namespace_id = "4"
simple = { limit = 60, period = 60 }

# The iPhone makes a rendezvous box for each pairing code. The other rendezvous requests share the second limit.
[[ratelimits]]
name = "RENDEZVOUS_CREATE"
namespace_id = "5"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RENDEZVOUS_LIMIT"
namespace_id = "6"
simple = { limit = 60, period = 60 }

# A Mac makes a room for a team. The Room Durable Object also allows 10 per hour for each IP. The other room requests
# share the second limit: several Macs of one office can have one IP address, and each write of a member makes each
# other Mac read.
[[ratelimits]]
name = "ROOM_CREATE"
namespace_id = "7"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ROOM_LIMIT"
namespace_id = "8"
simple = { limit = 3000, period = 60 }

[observability]
enabled = false
