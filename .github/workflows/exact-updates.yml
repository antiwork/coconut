name: Exact updates

# Builds Coconut's Exact app (exact/) as a binary that takes signed over-the-air updates, and publishes those updates.
#
# Exact Build only makes development binaries, and a development binary never checks the update channel of app.json
# (Exact's update/src/binary.rs, head_url). A release binary of the pinned Exact needs Xcode 27.1, which GitHub's
# xcode-27 image has. Two actions:
#
#   build  A release binary with an update store, for AppDrop (the artifact coconut-exact-ipa). Run it after a change
#          to native code: a new grant, a native module, a newer Exact. It publishes nothing: the next push starts
#          the binary's stream, so a first launch takes no update while the person pairs.
#   push   An update of the Contract, the assets and app.ts to every installed binary that can take it. With
#          deploy.activate "immediate", an app takes it the next time it comes to the foreground (at most one check a
#          minute). A binary that cannot take it (one built before a grant) keeps what it has. When no binary can,
#          the run fails and publishes nothing: the change then needs `build`.
#   check  What push would publish to each stream, without publishing: the compile check of a change.
#
# push finds a binary's stream on the origin once the stream has a head. The newest binary's first head comes from its
# production build receipt, which the build embeds in the app as receipt.json; the job takes it from the newest
# coconut-exact-ipa artifact. Exact at the pinned commit gets the patches in .github/exact-patches: unpatched, push
# refuses every update while the channel holds a stream of an older binary that needs a new one.
#
# The channel is "appdrop": AppDrop's origin for the signing key, with no server and no account. The private key is the
# secret EXACT_SIGNING_KEY of the environment exact-updates (main only); its public half is deploy.signing.keys.coconut
# in exact/app.json, and a binary takes only updates signed by it.
on:
  workflow_dispatch:
    inputs:
      action:
        description: push sends an update to installed apps; check shows what push would send; build makes a new binary.
        type: choice
        options: [push, check, build]
        default: push

permissions:
  contents: read
  # The receipt of the newest binary is in the artifact of its build.
  actions: read

concurrency:
  group: exact-updates
  cancel-in-progress: false

env:
  # docs/exact.md records this commit. Each update must come from the Exact that built the binary.
  EXACT_COMMIT: 8ed52642a2c4a6227c8abfafd80ecf501b1eb5aa
  BUN_VERSION: 1.4.4

jobs:
  exact:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: exact-updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out Exact at the pinned commit
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/expo/exact.git "$RUNNER_TEMP/exact"
          git -C "$RUNNER_TEMP/exact" checkout --quiet "$EXACT_COMMIT"
          # Written for this commit: a patch that no longer applies after a bump fails here, so check it upstream.
          git -C "$RUNNER_TEMP/exact" apply "$GITHUB_WORKSPACE"/.github/exact-patches/*.patch
          echo "EXACT=$RUNNER_TEMP/exact" >> "$GITHUB_ENV"

      - name: Install Bun and rustup
        run: |
          set -euo pipefail
          curl -fsSL https://bun.sh/install | bash -s "bun-v$BUN_VERSION"
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none --profile minimal
          echo "BUN=$HOME/.bun/bin/bun" >> "$GITHUB_ENV"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - name: Set up Exact for iPhones
        working-directory: ${{ runner.temp }}/exact
        run: |
          set -euo pipefail
          bun scripts/exact.mjs setup
          bun scripts/exact.mjs setup --check --platform ios --device

      - name: Write the update signing key
        env:
          EXACT_SIGNING_KEY: ${{ secrets.EXACT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$EXACT_SIGNING_KEY"
          mkdir -p ~/.config/exact/keys
          umask 077
          printf '%s\n' "$EXACT_SIGNING_KEY" > ~/.config/exact/keys/coconut.pem

      - name: Build the release binary
        if: inputs.action == 'build'
        working-directory: exact
        run: |
          set -euo pipefail
          EXACT_UPDATE_GENESIS=1 EXACT_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1)) \
            bun exact.mjs ios --device --release --unsigned --archive .exact/app.ipa --json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.action == 'build'
        with:
          name: coconut-exact-ipa
          path: exact/.exact/app.ipa
          # The first push after a build starts the binary's stream from this artifact.
          retention-days: 90
          if-no-files-found: error

      - name: Restore the receipt of the newest binary
        if: inputs.action != 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_BAKE_OUTPUT: ${{ runner.temp }}/exact-bake
        run: |
          set -euo pipefail
          mkdir -p "$EXACT_BAKE_OUTPUT"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=coconut-exact-ipa&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
          if [ -z "$id" ]; then
            echo "No build artifact: push reaches only the streams that have a head."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/ipa.zip"
          unzip -q -o "$RUNNER_TEMP/ipa.zip" -d "$RUNNER_TEMP/ipa"
          unzip -p "$RUNNER_TEMP/ipa/app.ipa" 'Payload/*.app/receipt.json' | jq '.build' > "$EXACT_BAKE_OUTPUT/ios-aarch64-apple-ios.build.json"
          jq -r '"The receipt of binary \(.binary.sha256[0:12]), stream \(.compat.id[0:8])"' "$EXACT_BAKE_OUTPUT/ios-aarch64-apple-ios.build.json"

      - name: Push an update to installed apps
        if: inputs.action != 'build'
        working-directory: exact
        env:
          EXACT_BAKE_OUTPUT: ${{ runner.temp }}/exact-bake
          EXACT_PUSH_DRY_RUN: ${{ inputs.action == 'check' && '1' || '0' }}
        run: |
          set -euo pipefail
          bun exact.mjs push

      - name: Remove the signing key
        if: always()
        run: rm -f ~/.config/exact/keys/coconut.pem
