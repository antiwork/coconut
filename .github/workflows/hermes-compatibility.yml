name: Hermes compatibility

# Coconut runs on the Hermes that the person installed. backend/coconut/hermes_versions.json names the oldest supported
# Hermes release and the releases that CI tested. Each pull request and each push to main checks the minimum release
# and the latest release. Both are required. Each night, CI also checks Hermes main. That check can fail without a
# failed check run, because the Mac mini updater deploys only a commit whose check runs all passed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-compatibility-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  contracts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the image decoder used by Hermes
        run: python -m pip install Pillow==12.3.0
      - name: Check syntax
        run: python -m compileall -q backend/coconut scripts
      - name: Check Hermes contracts and recovery
        env:
          PYTHONPATH: backend
          COCONUT_VERIFY_TASK_CACHE: '1' # Each read of the kept tasks is compared with the table.
        run: |
          # Each file runs in its own process because test module names collide.
          for test in backend/tests/test_*.py; do
            python -m unittest discover -s backend/tests -p "$(basename "$test")"
          done
      - name: Check automatic deployment and releases
        run: python -m unittest discover -s scripts -p test_automatic_update.py

  hermes-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Choose the Hermes versions to check
        id: legs
        env:
          NIGHTLY: ${{ github.event_name == 'schedule' }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          versions = json.load(open('backend/coconut/hermes_versions.json'))
          if os.environ['NIGHTLY'] == 'true':
              legs = [{'name': 'Hermes main', 'arguments': '--channel main', 'required': False}]
          else:
              # Without --commit or --channel, the installer installs the latest stable release.
              legs = [{'name': 'Hermes ' + versions['minimum'], 'arguments': '--commit v' + versions['minimum'], 'required': True},
                      {'name': 'latest Hermes release', 'arguments': '', 'required': True}]
          print('legs=' + json.dumps(legs))
          PYTHON

  native-kanban-hermes:
    name: native-kanban (${{ matrix.leg.name }})
    needs: hermes-versions
    runs-on: ubuntu-latest
    # Recent runs took 17 to 24 minutes, and the installation adds a few minutes. The step limits below end first.
    # Then a timeout of the Hermes main leg is a failed step that continue-on-error covers, not a timed-out job.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.hermes-versions.outputs.legs) }}
    env:
      HERMES_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Exact historical worker negative controls.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Hermes with the official installer
        id: install
        continue-on-error: ${{ !matrix.leg.required }}
        timeout-minutes: 10
        env:
          ARGUMENTS: ${{ matrix.leg.arguments }}
        run: |
          # The installer puts the Hermes source folder and its dependency environment in a temporary HERMES_HOME.
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh -o "$RUNNER_TEMP/install.sh"
          # shellcheck disable=SC2086 # ARGUMENTS holds zero or more installer options.
          bash "$RUNNER_TEMP/install.sh" --non-interactive --skip-browser --skip-computer-use $ARGUMENTS
          # Coconut finds and checks the installed Hermes as the service does at each start.
          PYTHONPATH=backend COCONUT_HERMES_ROOT="$HERMES_HOME/hermes-agent" python - <<'PYTHON'
          import os
          from coconut import hermes_runtime
          runtime = hermes_runtime.find()
          hermes_runtime.check(runtime)
          tested = hermes_runtime.is_tested(runtime.version)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'COCONUT_HERMES_ROOT={runtime.root}\nCOCONUT_HERMES_PYTHON={runtime.python}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Hermes {runtime.version} passed the contract check. Tested: {tested}.\n')
          print(f'Hermes {runtime.version} in {runtime.root} passed the contract check.')
          if not tested:
              print(f'::warning::Hermes {runtime.version} is not in backend/coconut/hermes_versions.json. '
                    f'The newest tested version is {hermes_runtime.newest_tested()}. '
                    'Add this version to "tested" when the checks pass.')
          PYTHON
          # The last step compares this with the state after the tests.
          git -C "$HERMES_HOME/hermes-agent" status --porcelain --untracked-files=no > "$RUNNER_TEMP/hermes-source-status"
      - name: Check native claims, recovery, and worktrees
        id: native
        if: steps.install.outcome == 'success'
        continue-on-error: ${{ !matrix.leg.required }}
        timeout-minutes: 32
        env:
          PYTHONPATH: backend
          COCONUT_REQUIRE_NATIVE: '1' # A missing Hermes install fails the native tests instead of skipping them.
          # Each test gives Hermes its own HERMES_HOME. Without this setting, Hermes from the official installer installs
          # a dependency set for each new home.
          HERMES_DISABLE_LAZY_INSTALLS: '1'
        run: |
          mkdir -p .runtime # The logs of the checks below.
          "$COCONUT_HERMES_PYTHON" -c 'import jsonschema' # Required: this CI regression suite must not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_draft_refresh_schema.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_pairing_redaction.py 2> .runtime/pairing-redaction.log || { cat .runtime/pairing-redaction.log; exit 1; }
          cat .runtime/pairing-redaction.log
          grep -qx 'OK' .runtime/pairing-redaction.log # The pairing link must pass the redaction of this Hermes, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_withdrawal_correction_route.py 2> .runtime/withdrawal-correction-route.log || { cat .runtime/withdrawal-correction-route.log; exit 1; }
          cat .runtime/withdrawal-correction-route.log
          grep -qx 'OK' .runtime/withdrawal-correction-route.log # The registered schema check must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_turn_timings.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_interim_messages.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_live_messages.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_initial_input.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_api_fallback.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_compression.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_turn_context_replay.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_prompt_refresh.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_compression_fallback.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_receipt_context.py
          "$COCONUT_HERMES_PYTHON" scripts/test_native_receipt_context.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON" --evidence .runtime/receipt-test-evidence
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_kanban.py 2> .runtime/native-kanban.log || { cat .runtime/native-kanban.log; exit 1; }
          cat .runtime/native-kanban.log
          grep -qx 'OK' .runtime/native-kanban.log # The real board wait and completion checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_dependency_unlink.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_claim_continuation.py 2> .runtime/native-claim-continuation.log || { cat .runtime/native-claim-continuation.log; exit 1; }
          cat .runtime/native-claim-continuation.log
          grep -qx 'OK' .runtime/native-claim-continuation.log # The requester-root callback dispatch checks must run, not skip.
          grep -Eq '^Ran 38 tests in ' .runtime/native-claim-continuation.log # Includes the approved proposal root checks and its waits for the helper's reply.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_waiting_occurrence_release.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_occurrence_completion.py 2> .runtime/native-occurrence-completion.log || { cat .runtime/native-occurrence-completion.log; exit 1; }
          cat .runtime/native-occurrence-completion.log
          grep -qx 'OK' .runtime/native-occurrence-completion.log # A skipped run prints 'OK (skipped=N)' and fails here.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_work_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_independent_technical_work.py 2> .runtime/independent-technical-work.log || { cat .runtime/independent-technical-work.log; exit 1; }
          cat .runtime/independent-technical-work.log
          grep -qx 'OK' .runtime/independent-technical-work.log # The real review card claim and finish checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_delegated_report_continuation.py 2> .runtime/delegated-report-continuation.log || { cat .runtime/delegated-report-continuation.log; exit 1; }
          cat .runtime/delegated-report-continuation.log
          grep -qx 'OK' .runtime/delegated-report-continuation.log # The native dispatch checks must run, not skip.
          grep -Eq '^Ran 49 tests in ' .runtime/delegated-report-continuation.log # Includes a requester turn that a delivered result started.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_registered_delegation_continuation.py 2> .runtime/registered-delegation-continuation.log || { cat .runtime/registered-delegation-continuation.log; exit 1; }
          cat .runtime/registered-delegation-continuation.log
          grep -qx 'OK' .runtime/registered-delegation-continuation.log # The registered PR dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_delegated_block_pause.py 2> .runtime/native-delegated-block-pause.log || { cat .runtime/native-delegated-block-pause.log; exit 1; }
          cat .runtime/native-delegated-block-pause.log
          grep -qx 'OK' .runtime/native-delegated-block-pause.log # The native board and registry pause checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_continuation_snapshot_eviction.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_requester_callback_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_foreground_dispatch.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_source_ownership.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_tool_store.py 2> .runtime/native-tool-store.log || { cat .runtime/native-tool-store.log; exit 1; }
          cat .runtime/native-tool-store.log
          grep -qx 'OK' .runtime/native-tool-store.log # The installer's source must not choose a bot's tool store, so the check must not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_browser_socket.py 2> .runtime/native-browser-socket.log || { cat .runtime/native-browser-socket.log; exit 1; }
          cat .runtime/native-browser-socket.log
          grep -qx 'OK' .runtime/native-browser-socket.log # The harness daemon must listen in a bot, so the check must not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_work_display.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_pr_links.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_work_workspace.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_workspace_handoff.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_workspace_recovery.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_targeted_bot_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_kanban_workers.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_session_maintenance.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_model_catalog_native.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_settings_migration.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_runtime_environment.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_provider_failure_retry.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_settle_native_orphans.py 2> .runtime/settle-native-orphans.log || { cat .runtime/settle-native-orphans.log; exit 1; }
          cat .runtime/settle-native-orphans.log
          grep -qx 'OK' .runtime/settle-native-orphans.log # The real archive and callback re-kind checks must run, not skip.
          grep -Eq '^Ran 33 tests in ' .runtime/settle-native-orphans.log # Includes the released block checks through the real dispatcher.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_failed_routine_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_failed_request_continuation.py 2> .runtime/archived-failed-request-continuation.log || { cat .runtime/archived-failed-request-continuation.log; exit 1; }
          cat .runtime/archived-failed-request-continuation.log
          grep -qx 'OK' .runtime/archived-failed-request-continuation.log # The native dispatch checks must run, not skip.
          grep -Eq '^Ran 25 tests in ' .runtime/archived-failed-request-continuation.log # Includes the successor that a provider stop ended.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_scheduled_routine_continuation.py 2> .runtime/archived-scheduled-routine-continuation.log || { cat .runtime/archived-scheduled-routine-continuation.log; exit 1; }
          cat .runtime/archived-scheduled-routine-continuation.log
          grep -qx 'OK' .runtime/archived-scheduled-routine-continuation.log # The native dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_scheduled_assignment_continuation.py 2> .runtime/archived-scheduled-assignment-continuation.log || { cat .runtime/archived-scheduled-assignment-continuation.log; exit 1; }
          cat .runtime/archived-scheduled-assignment-continuation.log
          grep -qx 'OK' .runtime/archived-scheduled-assignment-continuation.log # The native dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_scheduled_original_continuation.py 2> .runtime/archived-scheduled-original-continuation.log || { cat .runtime/archived-scheduled-original-continuation.log; exit 1; }
          cat .runtime/archived-scheduled-original-continuation.log
          grep -qx 'OK' .runtime/archived-scheduled-original-continuation.log # The native dispatch and worktree restore checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_relay_roster.py
          "$COCONUT_HERMES_PYTHON" scripts/test_native_kanban.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON"
          "$COCONUT_HERMES_PYTHON" scripts/test_completed_routine_continuation.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON"
          "$COCONUT_HERMES_PYTHON" scripts/test_script_routines.py --local
          # The tests do not change the Hermes source folder.
          git -C "$COCONUT_HERMES_ROOT" status --porcelain --untracked-files=no | diff "$RUNNER_TEMP/hermes-source-status" -
      - name: Report a failure of Hermes main
        # Only the Hermes main leg continues after a failure. Its check run passes, and this step reports the failure.
        if: steps.install.outcome == 'failure' || steps.native.outcome == 'failure'
        run: |
          echo "::warning::The installation or the native checks failed on Hermes main. A future Hermes release can break Coconut."
          echo 'The installation or the native checks failed on Hermes main. A future Hermes release can break Coconut.' >> "$GITHUB_STEP_SUMMARY"

  # The Mac mini updater and branch protection require the check names contracts and native-kanban. This job gives the
  # required Hermes legs that one name.
  native-kanban:
    if: always() && github.event_name != 'schedule'
    needs: native-kanban-hermes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every required Hermes leg to pass
        env:
          RESULT: ${{ needs.native-kanban-hermes.result }}
        run: test "$RESULT" = success
