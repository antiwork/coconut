name: Hermes compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m compileall -q backend/coconut scripts
      - name: Check Hermes contracts and recovery
        env:
          PYTHONPATH: backend
        run: |
          for test in test_work_source_retry.py test_delegation_origin.py test_work_audit_returns.py test_work_audit_isolation.py test_decision_call_recovery.py test_work_list_reconciliation.py test_durable_delegations.py test_work_source_coverage.py test_work_queue_isolation.py test_receipt_lookup.py test_request_responsiveness.py test_work_report_continuation.py test_work_followup_identity.py test_work_recovery.py test_automatic_work.py test_tracked_work.py test_followup_conversation_scope.py test_context_presence.py test_decision_followups.py test_decision_reply_receipts.py test_decision_inbox.py test_work_questions.py test_work_dependency_context.py test_bot_contact_purpose.py test_hermes_compatibility.py test_hermes_release_routines.py test_native_scheduler.py test_native_execution.py test_native_relay_recovery.py; do
            python -m unittest discover -s backend/tests -p "$test"
          done
