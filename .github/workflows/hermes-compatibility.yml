name: Hermes compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the image decoder used by Hermes
        run: python -m pip install Pillow==12.3.0
      - name: Check syntax
        run: python -m compileall -q backend/coconut scripts
      - name: Check Hermes contracts and recovery
        env:
          PYTHONPATH: backend
        run: |
          # Each file runs in its own process because test module names collide.
          for test in backend/tests/test_*.py; do
            python -m unittest discover -s backend/tests -p "$(basename "$test")"
          done
      - name: Check automatic deployment and releases
        run: python -m unittest discover -s scripts -p test_automatic_update.py
      - name: Check the candidate Hermes runner
        run: python -m unittest discover -s scripts -p test_check_hermes_candidate.py

  native-kanban:
    runs-on: ubuntu-latest
    # Recent runs took 17 to 24 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # Exact historical worker negative controls.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the pinned Hermes runtime without source changes
        run: |
          python -m pip install uv==0.12.10
          revision=$(python -c 'import sys; sys.path.insert(0, "scripts"); from hermes import REVISION; print(REVISION)')
          git init .runtime/hermes-source
          git -C .runtime/hermes-source fetch --depth=1 https://github.com/NousResearch/hermes-agent.git "$revision"
          git -C .runtime/hermes-source checkout --detach FETCH_HEAD
          uv sync --project .runtime/hermes-source --frozen --no-dev --extra anthropic --extra mcp --python 3.14
      - name: Check native claims, recovery, and worktrees
        run: |
          export COCONUT_HERMES_ROOT="$PWD/.runtime/hermes-source"
          export COCONUT_HERMES_PYTHON="$COCONUT_HERMES_ROOT/.venv/bin/python"
          export PYTHONPATH=backend
          export COCONUT_REQUIRE_NATIVE=1 # A missing Hermes install fails the native completion proof tests instead of skipping them.
          "$COCONUT_HERMES_PYTHON" -c 'import jsonschema' # Required: this CI regression suite must not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_draft_refresh_schema.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_withdrawal_correction_route.py 2> .runtime/withdrawal-correction-route.log || { cat .runtime/withdrawal-correction-route.log; exit 1; }
          cat .runtime/withdrawal-correction-route.log
          grep -qx 'OK' .runtime/withdrawal-correction-route.log # The registered schema check must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_turn_timings.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_live_messages.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_initial_input.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_api_fallback.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_compression.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_turn_context_replay.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_compression_fallback.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_receipt_context.py
          "$COCONUT_HERMES_PYTHON" scripts/test_native_receipt_context.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON" --evidence .runtime/receipt-test-evidence
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_kanban.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_dependency_unlink.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_claim_continuation.py 2> .runtime/native-claim-continuation.log || { cat .runtime/native-claim-continuation.log; exit 1; }
          cat .runtime/native-claim-continuation.log
          grep -qx 'OK' .runtime/native-claim-continuation.log # The requester-root callback dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_waiting_occurrence_release.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_occurrence_completion.py 2> .runtime/native-occurrence-completion.log || { cat .runtime/native-occurrence-completion.log; exit 1; }
          cat .runtime/native-occurrence-completion.log
          grep -qx 'OK' .runtime/native-occurrence-completion.log # A skipped run prints 'OK (skipped=N)' and fails here.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_work_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_delegated_report_continuation.py 2> .runtime/delegated-report-continuation.log || { cat .runtime/delegated-report-continuation.log; exit 1; }
          cat .runtime/delegated-report-continuation.log
          grep -qx 'OK' .runtime/delegated-report-continuation.log # The native dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_registered_delegation_continuation.py 2> .runtime/registered-delegation-continuation.log || { cat .runtime/registered-delegation-continuation.log; exit 1; }
          cat .runtime/registered-delegation-continuation.log
          grep -qx 'OK' .runtime/registered-delegation-continuation.log # The registered PR dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_continuation_snapshot_eviction.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_requester_callback_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_foreground_dispatch.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_source_ownership.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_work_display.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_pr_links.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_work_workspace.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_workspace_handoff.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_workspace_recovery.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_targeted_bot_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_kanban_workers.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_session_maintenance.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_model_catalog_native.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_provider_failure_retry.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_settle_native_orphans.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_failed_routine_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_failed_request_continuation.py 2> .runtime/archived-failed-request-continuation.log || { cat .runtime/archived-failed-request-continuation.log; exit 1; }
          cat .runtime/archived-failed-request-continuation.log
          grep -qx 'OK' .runtime/archived-failed-request-continuation.log # The native dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_scheduled_routine_continuation.py 2> .runtime/archived-scheduled-routine-continuation.log || { cat .runtime/archived-scheduled-routine-continuation.log; exit 1; }
          cat .runtime/archived-scheduled-routine-continuation.log
          grep -qx 'OK' .runtime/archived-scheduled-routine-continuation.log # The native dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_archived_scheduled_assignment_continuation.py 2> .runtime/archived-scheduled-assignment-continuation.log || { cat .runtime/archived-scheduled-assignment-continuation.log; exit 1; }
          cat .runtime/archived-scheduled-assignment-continuation.log
          grep -qx 'OK' .runtime/archived-scheduled-assignment-continuation.log # The native dispatch checks must run, not skip.
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_relay_roster.py
          "$COCONUT_HERMES_PYTHON" scripts/test_native_kanban.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON"
          "$COCONUT_HERMES_PYTHON" scripts/test_completed_routine_continuation.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON"
          "$COCONUT_HERMES_PYTHON" scripts/test_script_routines.py --local
          test -z "$(git -C .runtime/hermes-source status --porcelain --untracked-files=no)"
