name: Hermes compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the image decoder used by Hermes
        run: python -m pip install Pillow==12.3.0
      - name: Check syntax
        run: python -m compileall -q backend/coconut scripts
      - name: Check Hermes contracts and recovery
        env:
          PYTHONPATH: backend
        run: |
          python -m unittest discover -s backend/tests -p test_pr_context_selection.py
          for test in test_pr_observation_latency.py test_service_pr.py test_pr_tracking.py test_pr_monitor_signals.py test_merge_decision_lifecycle.py test_exchange_transcript.py test_work_read_cost.py test_api_fallback.py test_work_outcome_alias.py test_work_scope_completion.py test_draft_freshness.py test_message_drafts.py test_external_work_waits.py test_saved_delegation_results.py test_routine_wait_ownership.py test_pr_review_freshness.py test_work_context_continuation.py test_delegated_work_duplicates.py test_decision_freshness.py test_state_sync.py test_worker_activity.py test_background_processes.py test_concurrent_work.py test_work_self_recovery.py test_work_pauses.py test_work_queue_position.py test_continuation_lookup.py test_parallel_work.py test_decision_burst.py test_work_model.py test_work_status.py test_pull_request_reviews.py test_work_blockers.py test_work_followups.py test_dispatch_recovery.py test_source_audit_reuse.py test_work_decision_wait.py test_work_source_retry.py test_delegation_origin.py test_work_audit_returns.py test_work_audit_isolation.py test_decision_call_recovery.py test_work_list_reconciliation.py test_durable_delegations.py test_work_source_coverage.py test_work_queue_isolation.py test_receipt_lookup.py test_request_responsiveness.py test_work_report_continuation.py test_work_followup_identity.py test_work_recovery.py test_automatic_work.py test_tracked_work.py test_followup_conversation_scope.py test_context_completions.py test_context_presence.py test_decision_followups.py test_decision_reply_receipts.py test_card_text_responses.py test_conversation_continuity.py test_decision_inbox.py test_decision_sources.py test_decision_previews.py test_work_questions.py test_work_dependency_context.py test_bot_contact_purpose.py test_hermes_compatibility.py test_hermes_release_routines.py test_native_scheduler.py test_native_execution.py test_native_relay_recovery.py test_native_profile_fixture.py test_native_work_continuation.py test_relay_wakeup.py test_targeted_bot_continuation.py test_runtime_deployment.py test_deploy_tools.py test_terminal_tools.py; do
            python -m unittest discover -s backend/tests -p "$test"
          done
      - name: Check delayed tool confirmations
        env:
          PYTHONPATH: backend:backend/tests
        run: python -m unittest test_provider.ProviderTests.test_delayed_service_receipts_do_not_abandon_or_repeat_tools test_provider.ProviderTests.test_worker_exits_when_the_service_pipe_closes test_provider.ProviderTests.test_cancel_stops_a_blocked_model_call

  native-kanban:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install the pinned Hermes runtime without source changes
        run: |
          python -m pip install uv==0.12.10
          revision=$(python -c 'import sys; sys.path.insert(0, "scripts"); from hermes import REVISION; print(REVISION)')
          git init .runtime/hermes-source
          git -C .runtime/hermes-source fetch --depth=1 https://github.com/NousResearch/hermes-agent.git "$revision"
          git -C .runtime/hermes-source checkout --detach FETCH_HEAD
          uv sync --project .runtime/hermes-source --frozen --no-dev --extra anthropic --extra mcp --python 3.11
      - name: Check native claims, recovery, and worktrees
        run: |
          export COCONUT_HERMES_ROOT="$PWD/.runtime/hermes-source"
          export COCONUT_HERMES_PYTHON="$COCONUT_HERMES_ROOT/.venv/bin/python"
          export PYTHONPATH=backend
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_api_fallback.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_kanban.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_foreground_dispatch.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_source_ownership.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_work_display.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_native_pr_links.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_work_workspace.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_workspace_recovery.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_targeted_bot_continuation.py
          "$COCONUT_HERMES_PYTHON" -m unittest discover -s backend/tests -p test_kanban_workers.py
          "$COCONUT_HERMES_PYTHON" scripts/test_native_kanban.py --source "$COCONUT_HERMES_ROOT" --python "$COCONUT_HERMES_PYTHON"
          test -z "$(git -C .runtime/hermes-source status --porcelain --untracked-files=no)"
