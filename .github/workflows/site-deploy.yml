name: Site deploy

# workcoconut.com is the Cloudflare Worker `workcoconut`: the static files of site/ and no script. A push to main
# that changes site/ deploys it. The Pages project of the same name is deleted, so this Worker is the only thing
# that serves the site.
#
# The environment `site-deploy` accepts only the main branch. It holds one secret:
#   CLOUDFLARE_API_TOKEN   deploys the Worker workcoconut
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Of two pushes in a row, only the newest site has to be live, so a running deploy may stop.
concurrency:
  group: site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site-deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Deploy the Worker workcoconut
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The environment site-deploy needs CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          # The Wrangler version of the relay and the links worker.
          npx --yes wrangler@4.130.0 deploy --config site/wrangler.toml
      - name: Check the live site
        run: |
          set -euo pipefail
          # A new deployment reaches the edge in a few seconds.
          wanted="$(sha256sum site/index.html | cut -d' ' -f1)"
          for _ in $(seq 1 30); do
            live="$(curl -fsS https://workcoconut.com/ | sha256sum | cut -d' ' -f1 || true)"
            if [ "$live" = "$wanted" ]; then
              echo "workcoconut.com serves the pushed site/index.html." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::workcoconut.com does not serve the pushed site/index.html."
          exit 1
