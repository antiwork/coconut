name: TestFlight

# Archives the iPhone app and uploads it to TestFlight. Pushes coalesce into at most one update per hour. Hourly and
# manual runs use the same gate, and skip when no app input changed.
#
# Each run is public unless it turns `public` off. Internal testers get the build as soon as Apple has processed it.
# The job `public` then puts it into the external group Public, whose link anyone can join, and sends it to TestFlight
# App Review (scripts/appstore.py public-testflight). Testers of the link get it after approval: the first build of a
# version waits about a day, and later builds of the version often pass at once. While another build waits for that
# review, Apple takes no submission, so the job ends without one and the next release sends its own build.
#
# Signing needs no certificate secret. The job archives without a signature, and scripts/testflight.py signs the
# archive ad hoc with the entitlements of the project. Then xcodebuild exports it with automatic signing: through the
# App Store Connect API key, Xcode makes the App Store profiles and signs with a cloud-managed distribution
# certificate. The key must have the Admin role, or the App Manager role with access to cloud-managed distribution
# certificates.
#
# The version is the UTC date, such as 2026.10.27. The build number is the highest build number in App Store Connect,
# plus one. The job waits until App Store Connect lists the new build, so the next run gets a higher number.
#
# The jobs use the environment `mac-release` (main branch only) for these secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   the App Store Connect API key
# The upload does not change the internal groups. An internal group with automatic distribution gets the build from
# Apple.
# The release agent of Coconut starts this workflow twice a day. It does not run on push or on a schedule.
on:
  workflow_dispatch:
    inputs:
      public:
        description: Send the build to the public TestFlight link and its review, and allow it in App Review. Off keeps it for internal testers only.
        type: boolean
        default: true

permissions:
  contents: read
  actions: read   # the gate reads publication history while migrating older release runs
  deployments: write

# Two uploads must not run at the same time: both would read the same highest build number.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      sha: ${{ steps.gate.outputs.sha }}
      previous_sha: ${{ steps.gate.outputs.previous_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Check the hourly publication gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release_gate.py plan --channel iphone

  upload:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: mac-release
    outputs:
      build: ${{ steps.number.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The notes list the commits since the previous upload, so the job needs the history.
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The environment mac-release needs ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$key")
          # The cleanup step deletes the key, also when a later step fails.
          { echo "ASC_KEY=$key"; echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; } >> "$GITHUB_ENV"
      - name: Choose the version and the build number
        id: number
        run: |
          set -euo pipefail
          build="$(python3 scripts/testflight.py next-build --key "$ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")"
          version="$(date -u '+%Y.%-m.%-d')"
          { echo "BUILD=$build"; echo "VERSION=$version"; } >> "$GITHUB_ENV"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Coconut $version ($build) from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      # scripts/iphone.py also generates the project before each build, so a change of ios/project.yml reaches the app.
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Archive without a signature
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild archive \
            -project ios/Coconut.xcodeproj \
            -scheme Coconut \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Coconut.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM=66LJACJ2U7 \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"
      - name: Sign the archive ad hoc with its entitlements
        run: python3 scripts/testflight.py sign --archive "$RUNNER_TEMP/Coconut.xcarchive" --build "$BUILD"
      - name: Record the publication
        id: publication
        run: python3 scripts/release_gate.py begin --channel iphone
      - name: Sign for distribution and upload
        run: |
          set -euo pipefail
          python3 scripts/testflight.py export-options --output "$RUNNER_TEMP/ExportOptions.plist" \
            ${{ inputs.public && '--public' || '' }}
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Coconut.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Wait for App Store Connect to list the build
        run: |
          set -euo pipefail
          python3 scripts/testflight.py wait --key "$ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --build "$BUILD"
          echo "Uploaded Coconut $VERSION ($BUILD) for ${{ inputs.public && 'TestFlight and the public link' || 'internal TestFlight testing' }}." >> "$GITHUB_STEP_SUMMARY"
      # TestFlight shows this text to the tester as "What to Test": the newest changes first, then the full list.
      - name: Write the release notes and what to test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          previous="${{ needs.plan.outputs.previous_sha }}"
          arguments=(--key "$ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --build "$BUILD" --apply)
          if [ -n "${previous:-}" ] && git cat-file -e "${previous}^{commit}" 2>/dev/null; then
            arguments+=(--since "$previous")
          fi
          python3 scripts/testflight.py notes "${arguments[@]}"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Finish the publication record
        if: always() && steps.publication.outputs.id != ''
        run: python3 scripts/release_gate.py finish --id '${{ steps.publication.outputs.id }}' --state '${{ job.status }}'

  # Waits on a Linux runner while Apple processes the build, so the Mac runner is free once the upload is done.
  public:
    needs: [plan, upload]
    if: inputs.public
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: mac-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The environment mac-release needs ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077; printf '%s\n' "$ASC_KEY_P8" > "$key")
          # The cleanup step deletes the key, also when a later step fails.
          { echo "ASC_KEY=$key"; echo "ASC_KEY_ID=$ASC_KEY_ID"; echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"; } >> "$GITHUB_ENV"
      - name: Send the build to the public group and TestFlight App Review
        env:
          BUILD: ${{ needs.upload.outputs.build }}
        run: |
          set -euo pipefail
          python3 scripts/appstore.py public-testflight --key "$ASC_KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --build "$BUILD"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
