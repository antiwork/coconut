name: Mac app

# Coconut.app runs the service and the relay sidecar on the person's Mac. This job runs the unit tests of mac/ and the
# relay loopback test, builds the bundle with an ad-hoc signature, and checks that the bundle and its tool work.
on:
  pull_request:
    paths:
      - 'mac/**'
      - 'scripts/mac_app.py'
      - 'scripts/test_mac_app.py'
      - 'scripts/mac_feed.py'
      - 'scripts/test_mac_feed.py'
      - 'updates/**'
      - 'scripts/tunnel-*.swift'
      - 'scripts/test_tunnel_loopback.py'
      - 'ios/Tunnel/**'
      - 'ios/Coconut/PairingSetup.swift'
      - 'ios/Coconut/TunnelConnection.swift'
      - 'relay/**'
      - '.github/workflows/mac-app.yml'
      - '.github/workflows/mac-release.yml'
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - 'scripts/mac_app.py'
      - 'scripts/test_mac_app.py'
      - 'scripts/mac_feed.py'
      - 'scripts/test_mac_feed.py'
      - 'updates/**'
      - 'scripts/tunnel-*.swift'
      - 'scripts/test_tunnel_loopback.py'
      - 'ios/Tunnel/**'
      - 'ios/Coconut/PairingSetup.swift'
      - 'ios/Coconut/TunnelConnection.swift'
      - 'relay/**'
      - '.github/workflows/mac-app.yml'
      - '.github/workflows/mac-release.yml'

permissions:
  contents: read

concurrency:
  group: mac-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # The build number is the commit count of HEAD.
      - name: Run the unit tests
        run: |
          xcodebuild -version
          swift test --package-path mac
          python3 -m unittest discover -s scripts -p test_mac_app.py
          python3 -m unittest discover -s scripts -p test_mac_feed.py
      - name: Run the relay loopback test
        # The test client, the Miniflare relay, the sidecar, and the backend run on this runner. A skipped test fails the job.
        run: |
          set -euo pipefail
          npm ci --prefix relay --no-audit --no-fund
          python3 scripts/test_tunnel_loopback.py 2>&1 | tee "$RUNNER_TEMP/loopback.log"
          if grep -q 'skipped' "$RUNNER_TEMP/loopback.log"; then
            echo 'The loopback test skipped.' >&2
            exit 1
          fi
      - name: Build Coconut.app
        run: python3 scripts/mac_app.py build --output "$RUNNER_TEMP/mac"
      - name: Check the bundle
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/mac/Coconut.app"
          plutil -lint "$app/Contents/Info.plist" "$app"/Contents/Library/LaunchAgents/*.plist
          for binary in "$app/Contents/MacOS/Coconut" "$app"/Contents/Helpers/*; do
            test "$(lipo -archs "$binary")" = 'x86_64 arm64'
          done
          codesign --verify --deep --strict "$app"
          # Sparkle without the XPC services of a sandboxed app, and the feed in Info.plist.
          test -x "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          test ! -e "$app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices"
          plutil -extract SUFeedURL raw "$app/Contents/Info.plist" | grep -qx 'https://coconut-updates.gumroad.workers.dev/mac/appcast.xml'
          "$app/Contents/MacOS/Coconut" --help >/dev/null 2>&1 & app_pid=$!
          # The app links Sparkle from Contents/Frameworks. A missing framework stops it at once.
          sleep 3
          kill -0 "$app_pid"
          kill "$app_pid"
          # The archive must fit the 25 MiB limit of the update feed. The command fails above the limit.
          archive="$(python3 scripts/mac_app.py archive --output "$RUNNER_TEMP/mac")"
          echo "$(basename "$archive"): $(du -h "$archive" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          "$app/Contents/Helpers/coconut" version
          # Without an install, the tool reports that, and it reads the files of an install.
          COCONUT_INSTALL_DIR="$RUNNER_TEMP/none" "$app/Contents/Helpers/coconut" status --json | grep -q '"service" : "not_installed"'
          COCONUT_INSTALL_DIR="$PWD" "$app/Contents/Helpers/coconut" status --json | grep -q '"service" : "stopped"'
