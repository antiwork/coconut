name: iOS tests

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-unit-tests:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select an installed iPhone simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '-j'], text=True))['devices']
          phones = [device for runtime, entries in devices.items() if '.iOS-' in runtime
                    for device in entries if device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('The runner has no available iPhone simulator.')
          device = phones[0]
          print('Testing on ' + device['name'] + ' (' + device['udid'] + ')')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('COCONUT_TEST_SIMULATOR=' + device['udid'] + '\n')
          PY
      # A simulator is slow for its first minutes after a cold boot: the keychain and loopback requests can stall
      # for seconds. Boot it now, so it finishes that work while Xcode builds.
      - name: Boot the simulator
        run: xcrun simctl boot "$COCONUT_TEST_SIMULATOR"
      - name: Build iOS unit tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project ios/Coconut.xcodeproj \
            -scheme Coconut \
            -destination "platform=iOS Simulator,id=$COCONUT_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/CoconutDerivedData" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=""
      - name: Run iOS unit tests
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$COCONUT_TEST_SIMULATOR"
          xcodebuild test-without-building \
            -project ios/Coconut.xcodeproj \
            -scheme Coconut \
            -destination "platform=iOS Simulator,id=$COCONUT_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/CoconutDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/CoconutTests.xcresult" \
            -only-testing:CoconutTests
      - name: Summarize test results
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/CoconutTests.xcresult"; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/CoconutTests.xcresult"
          fi
